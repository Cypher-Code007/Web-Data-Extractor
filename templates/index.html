<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickScrape Utility</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h2 class="text-center mb-4">Web Data Extractor</h2>
        
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <form method="POST">
                    <div class="input-group">
                        <input type="url" name="url" class="form-control" placeholder="https://example.com" required value="{{ url }}">
                        <button class="btn btn-primary" type="submit">Scrape Data</button>
                    </div>
                </form>
            </div>
        </div>

        {% if results %}
            {% if results.error %}
                <div class="alert alert-danger">{{ results.error }}</div>
            {% else %}
                <div class="row">
                    <div class="col-md-6">
                        <h4>Headlines Found</h4>
                        <ul class="list-group">
                            {% for h in results.headlines %}
                                <li class="list-group-item">{{ h }}</li>
                            {% endfor %}
                        </ul>
                    </div>
                    <div class="col-md-6">
                        <h4>Extracted Links</h4>
                        <ul class="list-group">
                            {% for link in results.links %}
                                <li class="list-group-item text-truncate"><a href="{{ link }}" target="_blank">{{ link }}</a></li>
                            {% endfor %}
                        </ul>
                    </div>
                </div>
            {% endif %}
        {% endif %}
    </div>
</body>
</html>
